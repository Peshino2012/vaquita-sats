name: verificar-sitio

# Abre la app publicada en GitHub Pages con un navegador real y la cotización
# real del bitcoin: archivos, manifiesto, service worker, cálculo de la parte
# de cada uno y que abra sin conexión. Deja capturas como artefacto.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      URL: https://peshino2012.github.io/vaquita-sats/
    steps:
      - name: Archivos publicados
        run: |
          set -e
          for f in "" index.html manifest.webmanifest sw.js app.js logic.js cripto.js lightning.js nostr.js precio.js qr.js \
                   styles.css vendor/nostr.js vendor/qrcode.js icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL$f")
            echo "$code  $f"
            [ "$code" = "200" ]
          done
          curl -sf "${URL}manifest.webmanifest" | jq -e '.name and .start_url and (.icons | length >= 2)' > /dev/null
          echo "manifiesto OK"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Navegador real
        run: |
          npm i --no-save playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > prueba.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 390, height: 844 }, locale: 'es-AR' });
          const errores = [];
          p.on('pageerror', (e) => errores.push(String(e)));
          p.on('console', (m) => { if (m.type() === 'error') errores.push(m.text()); });
          await p.goto(process.env.URL);
          await p.waitForFunction(() => /1 BTC =/.test(document.getElementById('previa-precio').textContent), null, { timeout: 30000 });
          await p.fill('#total', '60.000');
          await p.fill('#nombres', 'Ana\nBeto\nCaro');
          await p.waitForFunction(() => navigator.serviceWorker.controller !== null, null, { timeout: 20000 }).catch(() => {});
          const r = await p.evaluate(async () => ({
            precio: document.getElementById('previa-precio').textContent,
            parte: document.getElementById('previa-parte').textContent,
            sw: !!(await navigator.serviceWorker.getRegistration()),
            sinScrollHorizontal: document.documentElement.scrollWidth <= window.innerWidth,
          }));
          await p.screenshot({ path: 'captura-real.png', fullPage: true });
          r.errores = [...errores];
          await p.context().setOffline(true);
          await p.reload();
          r.abreSinConexion = await p.isVisible('#form-nueva');
          console.log(JSON.stringify(r, null, 2));
          await b.close();
          if (!r.sw || !/Cada uno pone \$\s?20\.000 ≈ [\d.]+ sats/.test(r.parte) || r.errores.length || !r.sinScrollHorizontal || !r.abreSinConexion) process.exit(1);
          JS
          set -o pipefail
          node prueba.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captura-real
          path: captura-real.png
